version: 1
# The backend phase (npx ampx pipeline-deploy) is added in build step 5,
# when the Amplify Gen 2 backend in /amplify exists.
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
