version: 1
backend:
  phases:
    build:
      commands:
        - npm ci --cache .npm --prefer-offline
        # Deploys this branch's own backend (auth, data, storage, functions) and writes amplify_outputs.json.
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    build:
      commands:
        # The production branch must pass the launch checks (business details, site address, no demo data).
        - if [ "$AWS_BRANCH" = "main" ]; then npm run check:launch; fi
        # Builds the app, then prerenders public pages and listings and writes robots.txt and sitemap.xml.
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*
