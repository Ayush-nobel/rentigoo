version: 1
# The backend phase (npx ampx pipeline-deploy) is added in build step 5,
# when the Amplify Gen 2 backend in /amplify exists.
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        # The production branch must pass the launch checks (business details, no demo data).
        - if [ "$AWS_BRANCH" = "main" ]; then npm run check:launch; fi
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
